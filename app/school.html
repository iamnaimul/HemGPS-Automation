<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#0b6b57" />
    <link rel="icon" type="image/png" href="img/SCHOOL-LOGO-round.png" />
    <title>
      বিদ্যালয়ের তথ্য ড্যাশবোর্ড | হেমনগর সরকারি প্রাথমিক বিদ্যালয়
    </title>
    <!-- SheetJS is lazy-loaded on export click — not blocking first paint -->
    <style>
      /* ============================================================
         Design tokens — "Ink & Emerald" (matching students.html v2)
      ============================================================ */
      :root {
        --bg: #f4f6f5;
        --card: #ffffff;
        --surface: #f7f9f8;
        --text: #11201b;
        --text-soft: #43544d;
        --muted: #7b8a84;
        --border: #e3e9e6;
        --border-strong: #cfd9d4;

        --primary: #0b6b57;
        --primary-hover: #085646;
        --primary-soft: #e6f3ee;
        --primary-soft-2: #cde7dd;
        --accent: #e0a526;
        --gold: #e0a526;
        --gold-soft: #fdf3da;
        --ink: #0b2a22;
        --success: #10b981;
        --danger: #ef4444;
        --warning: #f59e0b;
        --excel: #1d7a4a;

        --grad-brand: linear-gradient(
          135deg,
          #082f27 0%,
          #0b6b57 58%,
          #14906f 100%
        );
        --grad-soft: linear-gradient(135deg, #eef8f3 0%, #fcf6e6 100%);
        --grad-gold: linear-gradient(135deg, #ecb53a 0%, #e0a526 100%);

        --font-body:
          "BCC Purno", "Noto Sans Bengali", "Hind Siliguri", Nikosh, NikoshBAN,
          "Segoe UI", Arial, sans-serif;
        --font-head:
          "BCC Purno Black", "BCC Purno", "Noto Sans Bengali", Nikosh,
          NikoshBAN, "Segoe UI", Arial, sans-serif;

        --radius: 16px;
        --radius-sm: 11px;
        --shadow-sm: 0 1px 2px rgba(11, 42, 34, 0.06);
        --shadow:
          0 1px 2px rgba(11, 42, 34, 0.04), 0 12px 32px rgba(11, 42, 34, 0.07);
        --shadow-md: 0 14px 34px rgba(11, 107, 87, 0.18);
        --shadow-lg: 0 30px 80px rgba(8, 30, 24, 0.35);
        --ring: 0 0 0 4px rgba(11, 107, 87, 0.16);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        scroll-behavior: smooth;
      }
      html,
      body {
        width: 100%;
        min-height: 100vh;
      }

      body {
        font-family: var(--font-body);
        background:
          radial-gradient(
            900px 380px at 0% -8%,
            rgba(11, 107, 87, 0.12),
            transparent 60%
          ),
          radial-gradient(
            700px 360px at 100% 0%,
            rgba(224, 165, 38, 0.1),
            transparent 60%
          ),
          var(--bg);
        background-attachment: fixed;
        color: var(--text);
        padding: 24px 20px 40px;
        font-size: 15.5px;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      /* Disable fixed background on mobile — smooth scroll */
      @media (max-width: 780px) {
        body {
          background-attachment: scroll;
        }
      }

      button,
      input,
      select,
      textarea {
        font-family: var(--font-body);
        font-size: inherit;
        line-height: inherit;
        outline: none;
      }
      button {
        cursor: pointer;
        border: 0;
        background: transparent;
      }
      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        font-family: var(--font-head);
        font-weight: 900;
        letter-spacing: 0.15px;
      }
      ::selection {
        background: var(--primary-soft-2);
      }

      .container {
        width: 100%;
        max-width: 1500px;
        margin: 0 auto;
        padding: 0;
      }

      /* ============================================================
         Hero header
      ============================================================ */
      .dashboard-header {
        position: relative;
        overflow: hidden;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 18px;
        margin-bottom: 24px;
        padding: 30px 34px;
        border-radius: 24px;
        background:
          radial-gradient(
              circle at 1px 1px,
              rgba(255, 255, 255, 0.09) 1px,
              transparent 0
            )
            0 0 / 22px 22px,
          var(--grad-brand);
        color: #fff;
        box-shadow: 0 20px 44px rgba(8, 47, 39, 0.28);
      }
      .dashboard-header::before {
        content: "";
        position: absolute;
        border-radius: 50%;
        background: rgba(224, 165, 38, 0.16);
        width: 300px;
        height: 300px;
        right: -90px;
        top: -150px;
        pointer-events: none;
      }
      .dashboard-header::after {
        content: "";
        position: absolute;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.06);
        width: 180px;
        height: 180px;
        right: 180px;
        bottom: -110px;
        pointer-events: none;
      }

      .dashboard-title {
        position: relative;
        z-index: 1;
        min-width: 0;
      }
      .dashboard-title h2 {
        font-size: 28px;
        line-height: 1.28;
        margin-bottom: 4px;
        letter-spacing: 0;
        color: #fff;
        text-shadow: 0 2px 10px rgba(8, 30, 24, 0.2);
      }
      .dashboard-title h3 {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        font-weight: 700;
        color: #ffe7a8;
        background: rgba(224, 165, 38, 0.2);
        border: 1px solid rgba(224, 165, 38, 0.55);
        padding: 4px 15px;
        border-radius: 999px;
        margin-top: 6px;
        letter-spacing: 0.3px;
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
      }

      .header-actions {
        position: relative;
        z-index: 1;
        display: flex;
        gap: 9px;
        flex-wrap: wrap;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 11px 20px;
        border-radius: 999px;
        font-size: 14.5px;
        font-weight: 800;
        border: 1px solid transparent;
        transition: all 0.2s ease;
        white-space: nowrap;
      }
      .header-actions .btn {
        background: rgba(255, 255, 255, 0.14);
        border-color: rgba(255, 255, 255, 0.28);
        color: #fff;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }
      .header-actions .btn:hover {
        background: rgba(255, 255, 255, 0.26);
        border-color: rgba(255, 255, 255, 0.55);
        transform: translateY(-2px);
        box-shadow: 0 10px 22px rgba(8, 30, 24, 0.28);
      }
      .header-actions .btn:active {
        transform: translateY(0);
      }
      .btn-success {
        background: var(--grad-gold);
        color: #3a2a00;
        box-shadow: 0 8px 18px rgba(224, 165, 38, 0.3);
      }
      .btn-success:hover {
        background: linear-gradient(135deg, #f0c14a 0%, #ecb53a 100%);
        transform: translateY(-1px);
      }
      .btn-secondary {
        background: #eaf0ed;
        color: var(--text-soft);
      }
      .btn-secondary:hover {
        background: #dce6e1;
        color: var(--text);
      }
      .btn-info {
        background: linear-gradient(135deg, #0f8a6b, #0b6b57);
        color: #fff;
      }
      .btn-excel {
        background: linear-gradient(135deg, #22a366, var(--excel));
        color: #fff;
      }
      .btn-purple {
        background: linear-gradient(135deg, #0f8a6b, #0b6b57);
        color: #fff;
      }

      /* ============================================================
         TOC NAV
      ============================================================ */
      .toc-nav {
        position: sticky;
        top: 10px;
        z-index: 30;
        display: flex;
        align-items: center;
        gap: 8px;
        overflow-x: auto;
        padding: 10px 12px;
        margin-bottom: 20px;
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(16px) saturate(160%);
        -webkit-backdrop-filter: blur(16px) saturate(160%);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow:
          0 8px 24px rgba(11, 107, 87, 0.1),
          inset 0 1px 0 #fff;
        scroll-snap-type: x proximity;
        scrollbar-width: thin;
        scrollbar-color: var(--primary-soft-2) transparent;
      }
      .toc-nav::before {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 3px;
        border-radius: 16px 16px 0 0;
        background: linear-gradient(90deg, var(--primary), var(--gold));
        opacity: 0.95;
      }
      .toc-nav::-webkit-scrollbar {
        height: 6px;
      }
      .toc-nav::-webkit-scrollbar-track {
        background: transparent;
      }
      .toc-nav::-webkit-scrollbar-thumb {
        background: var(--primary-soft-2);
        border-radius: 99px;
      }
      .toc-nav::-webkit-scrollbar-thumb:hover {
        background: #9cc9ba;
      }

      .toc-pill {
        position: relative;
        padding: 9px 16px;
        border-radius: 999px;
        background: #fff;
        border: 1px solid var(--border-strong);
        font-size: 13.5px;
        font-weight: 700;
        color: var(--text-soft);
        cursor: pointer;
        transition: all 0.18s ease;
        white-space: nowrap;
        flex: 0 0 auto;
        scroll-snap-align: start;
      }
      .toc-pill:hover {
        border-color: #9cc9ba;
        color: var(--primary);
        background: var(--primary-soft);
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(11, 107, 87, 0.16);
      }
      .toc-pill.active {
        background: var(--grad-brand);
        border-color: transparent;
        color: #fff;
        box-shadow: 0 8px 18px rgba(11, 107, 87, 0.35);
      }
      .toc-pill.active::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: -7px;
        width: 20px;
        height: 3px;
        border-radius: 99px;
        transform: translateX(-50%);
        background: var(--gold);
        opacity: 0.95;
      }

      /* ============================================================
         SECTION CARDS
      ============================================================ */
      .dashboard {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .section-card {
        position: relative;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 18px;
        overflow: hidden;
        box-shadow: var(--shadow-sm);
        transition:
          box-shadow 0.2s ease,
          border-color 0.2s ease,
          transform 0.2s ease;
        scroll-margin-top: 100px;
        /* PERF: skip rendering off-screen cards */
        content-visibility: auto;
        contain-intrinsic-size: 400px;
      }
      .section-card:hover {
        box-shadow: var(--shadow);
        border-color: #9cc9ba;
      }

      .section-card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 14px 20px;
        background: linear-gradient(180deg, #f6faf8 0%, #ffffff 100%);
        border-bottom: 1px solid var(--border);
        border-left: 5px solid var(--primary);
      }

      .section-card-title {
        font-family: var(--font-head);
        font-weight: 900;
        font-size: 16.5px;
        color: var(--text);
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
        flex: 1;
      }
      .section-card-title .sec-icon {
        width: 38px;
        height: 38px;
        border-radius: 11px;
        background: var(--grad-brand);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        box-shadow: 0 5px 14px rgba(11, 107, 87, 0.3);
      }
      .section-card-title .sec-icon svg {
        width: 19px;
        height: 19px;
      }
      .section-card-title .sec-text {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .section-card-header-right {
        display: flex;
        align-items: center;
        gap: 9px;
        flex-shrink: 0;
      }

      .count-badge {
        font-size: 13px;
        font-weight: 800;
        background: var(--primary-soft);
        color: var(--primary);
        padding: 5px 13px;
        border-radius: 999px;
        border: 1px solid var(--primary-soft-2);
        white-space: nowrap;
      }

      .edit-btn {
        background: var(--gold-soft);
        color: #a86b00;
        width: 38px;
        height: 38px;
        border-radius: 11px;
        border: 1px solid #f3d98f;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.18s ease;
        flex-shrink: 0;
      }
      .edit-btn:hover {
        background: var(--grad-brand);
        border-color: transparent;
        color: #fff;
        transform: translateY(-2px);
        box-shadow: 0 8px 18px rgba(11, 107, 87, 0.35);
      }
      .edit-btn:active {
        transform: translateY(0);
      }
      .edit-btn svg {
        width: 17px;
        height: 17px;
      }

      .section-card-body {
        padding: 18px 20px 20px;
      }

      /* ============================================================
         INFO GRID
      ============================================================ */
      .info-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
      }

      .info-item {
        position: relative;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 12px 15px 13px 18px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 0;
        overflow: hidden;
        transition: all 0.18s ease;
      }
      .info-item::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 4px;
        background: linear-gradient(180deg, var(--primary), var(--gold));
        opacity: 0;
        transition: opacity 0.18s ease;
      }
      .info-item:hover {
        border-color: #9cc9ba;
        background: #fff;
        box-shadow: 0 8px 20px rgba(11, 107, 87, 0.1);
        transform: translateY(-1px);
      }
      .info-item:hover::before {
        opacity: 1;
      }
      .info-item.full {
        grid-column: 1 / -1;
      }

      .info-label {
        font-family: var(--font-head);
        font-size: 12px;
        font-weight: 900;
        color: var(--muted);
        letter-spacing: 0.4px;
        line-height: 1.35;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .info-value-row {
        display: flex;
        align-items: flex-start;
        gap: 8px;
      }

      .info-value {
        font-size: 15.5px;
        font-weight: 700;
        color: var(--text);
        word-break: break-word;
        line-height: 1.42;
        flex: 1;
        min-width: 0;
      }
      .info-value.empty {
        color: #b3b9cf;
        font-style: italic;
        font-weight: 500;
      }
      .info-value.empty::before {
        content: "—";
      }

      .copy-btn {
        background: #fff;
        color: var(--muted);
        padding: 5px;
        border-radius: 7px;
        border: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        opacity: 0.7;
        transition: all 0.15s ease;
      }
      .copy-btn:hover {
        background: var(--primary-soft);
        color: var(--primary);
        border-color: #9cc9ba;
        opacity: 1;
        transform: scale(1.06);
      }
      .copy-btn.copied {
        background: var(--success);
        color: #fff;
        border-color: var(--success);
        opacity: 1;
      }
      .copy-btn svg {
        width: 13px;
        height: 13px;
      }

      .class-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      .class-chip {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 9px 16px;
        border-radius: 999px;
        background: var(--primary-soft);
        color: var(--primary);
        border: 1px solid var(--primary-soft-2);
        font-size: 14.5px;
        font-weight: 700;
        box-shadow: 0 2px 6px rgba(11, 107, 87, 0.08);
      }
      .class-chip svg {
        color: var(--primary);
        width: 13px;
        height: 13px;
      }

      .sub-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .sub-card {
        position: relative;
        background: #fff;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 15px 18px 17px 22px;
        overflow: hidden;
        transition: all 0.18s ease;
      }
      .sub-card::before {
        content: "";
        position: absolute;
        left: 0;
        top: 14px;
        bottom: 14px;
        width: 4px;
        border-radius: 0 4px 4px 0;
        background: linear-gradient(180deg, var(--primary), var(--gold));
      }
      .sub-card:hover {
        border-color: #9cc9ba;
        box-shadow: 0 8px 22px rgba(11, 107, 87, 0.1);
      }
      .sub-card-head {
        display: flex;
        align-items: center;
        gap: 11px;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px dashed var(--border-strong);
      }
      .sub-card-head .num-badge {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: var(--grad-brand);
        color: #fff;
        font-size: 13px;
        font-weight: 800;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        box-shadow: 0 4px 10px rgba(11, 107, 87, 0.3);
      }
      .sub-card-head .sub-title {
        font-family: var(--font-head);
        font-weight: 900;
        font-size: 15px;
        color: var(--text);
      }
      .sub-card .info-grid {
        grid-template-columns: repeat(3, 1fr);
      }

      .empty-state {
        padding: 30px 20px;
        text-align: center;
        color: var(--muted);
        font-size: 14.5px;
        font-weight: 600;
        background: var(--surface);
        border: 1.5px dashed var(--border-strong);
        border-radius: var(--radius-sm);
      }
      .empty-state svg {
        opacity: 0.5;
        margin-bottom: 8px;
        color: var(--primary);
      }

      /* ============================================================
         MODAL
      ============================================================ */
      .modal-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(6, 24, 19, 0.6);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        z-index: 1000;
        justify-content: center;
        align-items: center;
        padding: 20px;
        animation: fadeIn 0.22s ease;
        overflow-y: auto;
      }
      .modal-overlay.open {
        display: flex;
      }

      .modal-content {
        background: #fff;
        padding: 0;
        border-radius: 22px;
        width: 100%;
        max-width: 920px;
        max-height: 92vh;
        overflow-y: auto;
        box-shadow: var(--shadow-lg);
        border: 1px solid var(--primary-soft-2);
        animation: modalIn 0.24s ease;
      }
      @keyframes modalIn {
        from {
          opacity: 0;
          transform: translateY(-12px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      .modal-header-row {
        position: sticky;
        top: 0;
        z-index: 5;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin: 0;
        padding: 18px 24px;
        color: #fff;
        background: var(--grad-brand);
        flex-wrap: wrap;
      }
      .modal-header-row::after {
        content: "";
        position: absolute;
        width: 200px;
        height: 200px;
        border-radius: 50%;
        background: rgba(224, 165, 38, 0.18);
        right: -60px;
        top: -100px;
        pointer-events: none;
      }
      .modal-header-row h3 {
        position: relative;
        z-index: 1;
        font-size: 17px;
        color: #fff;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .modal-header-row h3 svg {
        width: 20px;
        height: 20px;
      }
      .modal-close-btn {
        position: relative;
        z-index: 1;
        background: rgba(255, 255, 255, 0.2);
        color: #fff;
        width: 38px;
        height: 38px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 17px;
        transition: 0.18s;
      }
      .modal-close-btn:hover {
        background: rgba(255, 255, 255, 0.4);
        transform: rotate(90deg);
      }

      #editBody {
        padding: 22px 24px;
      }

      .modal-actions {
        position: sticky;
        bottom: 0;
        display: flex;
        justify-content: flex-end;
        gap: 12px;
        margin: 0;
        padding: 16px 24px;
        background: #fff;
        border-top: 1px solid var(--border);
        flex-wrap: wrap;
        box-shadow: 0 -6px 18px rgba(11, 107, 87, 0.06);
      }

      .edit-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 14px;
      }
      .edit-grid .form-group.full {
        grid-column: 1 / -1;
      }
      .form-group label {
        display: block;
        font-size: 13px;
        font-weight: 800;
        margin-bottom: 7px;
        color: var(--text-soft);
        letter-spacing: 0.2px;
      }
      .form-group input,
      .form-group select,
      .form-group textarea {
        width: 100%;
        padding: 12px 15px;
        border: 1.5px solid var(--border-strong);
        border-radius: 12px;
        font-size: 15px;
        color: var(--text);
        background: #fff;
        transition: all 0.18s ease;
      }
      .form-group input::placeholder {
        color: #aab1c6;
      }

      /* ===== UNIFIED DESIGN SYSTEM v1.1.1-pro — identical in school / teachers / students ===== */
      :root {
        --bg: #f4f6f5;
        --card: #ffffff;
        --surface: #f7f9f8;
        --text: #11201b;
        --text-soft: #43544d;
        --muted: #7b8a84;
        --border: #e3e9e6;
        --border-strong: #cfd9d4;
        --primary: #0b6b57;
        --primary-hover: #085646;
        --primary-soft: #e6f3ee;
        --primary-soft-2: #cde7dd;
        --accent: #e0a526;
        --gold: #e0a526;
        --gold-soft: #fdf3da;
        --ink: #0b2a22;
        --success: #10b981;
        --danger: #ef4444;
        --warning: #f59e0b;
        --excel: #1d7a4a;
        --grad-brand: linear-gradient(135deg, #082f27 0%, #0b6b57 58%, #14906f 100%);
        --grad-soft: linear-gradient(135deg, #eef8f3 0%, #fcf6e6 100%);
        --grad-gold: linear-gradient(135deg, #ecb53a 0%, #e0a526 100%);
        --font-body: "BCC Purno", "Noto Sans Bengali", "Hind Siliguri", Nikosh,
          NikoshBAN, "Segoe UI", Arial, sans-serif;
        --font-head: "BCC Purno Black", "BCC Purno", "Noto Sans Bengali", Nikosh,
          NikoshBAN, "Segoe UI", Arial, sans-serif;
        --radius: 16px;
        --radius-sm: 11px;
        --shadow-sm: 0 1px 2px rgba(11, 42, 34, 0.06);
        --shadow: 0 1px 2px rgba(11, 42, 34, 0.04), 0 12px 32px rgba(11, 42, 34, 0.07);
        --shadow-md: 0 14px 34px rgba(11, 107, 87, 0.18);
        --shadow-lg: 0 30px 80px rgba(8, 30, 24, 0.35);
        --ring: 0 0 0 4px rgba(11, 107, 87, 0.16);
        --pad-x: 20px;
        --pad-top: 24px;
        --pad-bottom: 40px;
        --page-max: 1500px;
      }
      html {
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;

    <script>
      /* =====================================================================
         UNIFIED BACKUP v1.1.1-pro  —  একটি JSON ফাইলে school + teachers + students
         (এই ব্লকটি school.html / teachers.html / students.html — তিন ফাইলে হুবহু এক)
         Shared contract: তিনটি পেজ একই origin থেকে খুললে একই localStorage দেখে।
      ===================================================================== */
      (function () {
        "use strict";

        var FORMAT = "hemnagar-unified-backup";
        var FORMAT_VERSION = 1;
        var APP_VERSION = "1.1.1-pro";
        var APP_NAME = "হেমনগর সরকারি প্রাথমিক বিদ্যালয়";
        var PRE_KEY = "hemnagar_unified_prerestore";
        var LAST_KEY = "hemnagar_unified_last_backup";
        var RESTORE_KEY = "hemnagar_unified_last_restore";

        /* ক্রম = মডালে দেখানোর ক্রম */
        var SECTIONS = [
          {
            id: "school",
            label: "বিদ্যালয় তথ্য",
            kind: "object",
            keys: ["hemnagar_school_v1"],
            legacyFormat: "school-data-backup",
            legacyProp: "data",
            lastKeys: [],
            legacyPreKey: null,
          },
          {
            id: "teachers",
            label: "শিক্ষক তথ্য",
            kind: "array",
            keys: ["hemnagar_teachers_v1", "hemnagar_teachers_v1__bak"],
            valid: function (t) {
              return !!(t.nameBn || t.ipemisPin);
            },
            legacyFormat: "teacher-data-backup",
            legacyProp: "teachers",
            lastKeys: ["hemnagar_teachers_last_backup"],
            legacyPreKey: "hemnagar_teachers_v1__prerestore",
          },
          {
            id: "students",
            label: "শিক্ষার্থী তথ্য",
            kind: "array",
            keys: ["hemnagar_students_v20"],
            valid: function (t) {
              return !!(t.nameBn || t.roll);
            },
            legacyFormat: "student-data-backup",
            legacyProp: "students",
            lastKeys: ["hemnagar_last_backup"],
            legacyPreKey: "hemnagar_auto_backup_before_restore",
          },
        ];

        /* ---------- small helpers ---------- */
        var BN = ["০", "১", "২", "৩", "৪", "৫", "৬", "৭", "৮", "৯"];
        function toBn(n) {
          return String(n).replace(/\d/g, function (d) {
            return BN[+d];
          });
        }
        function pad(n) {
          return String(n).padStart(2, "0");
        }
        function esc(s) {
          return String(s == null ? "" : s)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
        }
        function isObj(x) {
          return x !== null && typeof x === "object" && !Array.isArray(x);
        }
        function lsGet(k) {
          try {
            return localStorage.getItem(k);
          } catch (e) {
            return null;
          }
        }
        function lsSet(k, v) {
          try {
            localStorage.setItem(k, v);
            return true;
          } catch (e) {
            return false;
          }
        }
        function lsDel(k) {
          try {
            localStorage.removeItem(k);
          } catch (e) {}
        }
        function parse(raw) {
          if (raw == null) return null;
          try {
            return JSON.parse(raw);
          } catch (e) {
            return null;
          }
        }
        function byId(id) {
          for (var i = 0; i < SECTIONS.length; i++)
            if (SECTIONS[i].id === id) return SECTIONS[i];
          return null;
        }

        /* ---------- normalise a raw value into a section's expected shape ---------- */
        function shape(sec, v) {
          if (sec.kind === "array") {
            if (Array.isArray(v)) v = v;
            else if (isObj(v) && Array.isArray(v[sec.id])) v = v[sec.id];
            else return null;
            v = v.filter(function (x) {
              return isObj(x) && (!sec.valid || sec.valid(x));
            });
            return v.length ? v : null;
          }
          /* object (school) */
          if (isObj(v) && isObj(v.data) && !v.classes) v = v.data;
          return isObj(v) && Object.keys(v).length ? v : null;
        }
        function countOf(sec, v) {
          if (!v) return 0;
          if (sec.kind === "array") return v.length;
          var n = 0;
          Object.keys(v).forEach(function (k) {
            var x = v[k];
            if (Array.isArray(x)) n += x.length ? 1 : 0;
            else if (isObj(x)) n += Object.keys(x).length ? 1 : 0;
            else if (x !== "" && x != null) n += 1;
          });
          return n;
        }
        function countLabel(sec, v) {
          var n = countOf(sec, v);
          if (!n) return "নেই";
          return sec.kind === "array" ? toBn(n) + " টি রেকর্ড" : "তথ্য আছে";
        }

        /* ---------- read current data straight from storage ---------- */
        function readCurrent(sec) {
          for (var i = 0; i < sec.keys.length; i++) {
            var v = shape(sec, parse(lsGet(sec.keys[i])));
            if (v) return v;
          }
          return null;
        }
        function snapshotAll() {
          var data = {};
          var any = false;
          SECTIONS.forEach(function (s) {
            var v = readCurrent(s);
            if (v) {
              data[s.id] = v;
              any = true;
            }
          });
          return any ? data : null;
        }
        function buildPayload(data) {
          var counts = {};
          Object.keys(data).forEach(function (id) {
            counts[id] = countOf(byId(id), data[id]);
          });
          return {
            format: FORMAT,
            formatVersion: FORMAT_VERSION,
            appVersion: APP_VERSION,
            appName: APP_NAME,
            exportDate: new Date().toISOString(),
            counts: counts,
            data: data,
          };
        }

        /* ---------- toast ---------- */
        var toastEl = null,
          toastT = null;
        function toast(msg, type) {
          var pt = document.getElementById("toast");
          if (pt && pt.classList.contains("toast")) {
            pt.textContent = msg;
            pt.className = "toast show " + (type || "");
            clearTimeout(pt._ubTm);
            pt._ubTm = setTimeout(function () {
              pt.className = "toast";
            }, 3200);
            return;
          }
          if (!toastEl) {
            toastEl = document.createElement("div");
            toastEl.setAttribute("role", "status");
            toastEl.style.cssText =
              "position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:100000;" +
              "padding:11px 18px;border-radius:12px;font-weight:600;font-size:14px;line-height:1.4;font-family:inherit;" +
              "color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:90vw;text-align:center;" +
              "transition:opacity .2s;opacity:0;pointer-events:none";
            document.body.appendChild(toastEl);
          }
          toastEl.textContent = msg;
          toastEl.style.background =
            type === "err" ? "var(--danger,#ef4444)" : "var(--success,#10b981)";
          toastEl.style.opacity = "1";
          clearTimeout(toastT);
          toastT = setTimeout(function () {
            toastEl.style.opacity = "0";
          }, 3000);
        }

        /* ---------- BACKUP ---------- */
        function backup() {
          var data = snapshotAll();
          if (!data) {
            toast("ব্যাকআপ করার জন্য কোনো ডেটা নেই", "err");
            return false;
          }
          var payload = buildPayload(data);
          var blob = new Blob([JSON.stringify(payload, null, 2)], {
            type: "application/json;charset=utf-8;",
          });
          var n = new Date();
          var name =
            "hemnagar_full_backup_" +
            pad(n.getDate()) + "-" + pad(n.getMonth() + 1) + "-" + n.getFullYear() +
            "_" + pad(n.getHours()) + "-" + pad(n.getMinutes()) + ".json";
          var url = URL.createObjectURL(blob);
          var a = document.createElement("a");
          a.href = url;
          a.download = name;
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(function () {
            URL.revokeObjectURL(url);
          }, 1500);

          var iso = new Date().toISOString();
          lsSet(LAST_KEY, iso);
          SECTIONS.forEach(function (s) {
            s.lastKeys.forEach(function (k) {
              lsSet(k, iso);
            });
          });
          var parts = SECTIONS.filter(function (s) {
            return data[s.id];
          }).map(function (s) {
            return s.label;
          });
          toast("সম্পূর্ণ ব্যাকআপ ডাউনলোড হয়েছে (" + parts.join(" + ") + ")", "ok");
          return true;
        }

        /* ---------- figure out what a chosen file contains ---------- */
        function detect(parsed, host) {
          var found = {};
          var label = "";
          if (isObj(parsed) && parsed.format === FORMAT && isObj(parsed.data)) {
            SECTIONS.forEach(function (s) {
              var v = shape(s, parsed.data[s.id]);
              if (v) found[s.id] = v;
            });
            if (!Object.keys(found).length) return null;
            return { found: found, meta: parsed, kind: "unified" };
          }
          /* পুরোনো আলাদা-আলাদা ব্যাকআপ ফাইল */
          SECTIONS.forEach(function (s) {
            if (isObj(parsed) && parsed.format === s.legacyFormat) {
              var raw = s.id === "school" ? parsed.data : parsed[s.legacyProp];
              var v = shape(s, raw);
              if (v) found[s.id] = v;
            }
          });
          if (Object.keys(found).length)
            return { found: found, meta: parsed, kind: "legacy" };
          /* ফরম্যাট-ফিল্ড নেই — যে পেজ থেকে খোলা হয়েছে তার ডেটা ধরে নিই */
          var hs = byId(host);
          if (hs) {
            var v2 = shape(hs, parsed);
            if (!v2 && isObj(parsed)) v2 = shape(hs, parsed[hs.legacyProp]);
            if (v2) {
              found[hs.id] = v2;
              return { found: found, meta: isObj(parsed) ? parsed : {}, kind: "legacy" };
            }
          }
          return null;
        }

        /* ---------- restore modal ---------- */
        var CSS = [
          "#ubModal{position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;",
          "background:rgba(8,30,24,.55);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);",
          "padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));",
          "font-family:var(--font-body,inherit)}",
          "#ubModal.open{display:flex}",
          "#ubModal .ub-box{background:var(--card,#fff);color:var(--text,#11201b);border-radius:24px;width:100%;max-width:540px;",
          "max-height:92vh;max-height:92dvh;overflow:auto;padding:24px;box-shadow:var(--shadow-lg,0 30px 80px rgba(8,30,24,.35));",
          "border:1px solid var(--border,#e3e9e6);overscroll-behavior:contain}",
          "#ubModal h3{margin:0 0 4px;font-family:var(--font-head,inherit);font-weight:900;font-size:19px;color:var(--text,#11201b)}",

        var modal = null;
        var pending = null; /* { found, meta, source } */

        function ensureModal() {
          if (modal) return modal;
          var st = document.createElement("style");
          st.textContent = CSS;
          document.head.appendChild(st);
          modal = document.createElement("div");
          modal.id = "ubModal";
          modal.setAttribute("role", "dialog");
          modal.setAttribute("aria-modal", "true");
          modal.setAttribute("aria-labelledby", "ubTitle");
          document.addEventListener("keydown", function (e) {
            if (e.key === "Escape" && modal.classList.contains("open")) cancel();
          });
          modal.innerHTML = '<div class="ub-box"></div>';
          modal.addEventListener("click", function (e) {
            if (e.target === modal) cancel();
          });
          document.body.appendChild(modal);
          return modal;
        }

        function fmtDate(iso) {
          var d = iso ? new Date(iso) : null;
          if (!d || isNaN(d)) return "অজানা";
          return toBn(
            pad(d.getDate()) + "/" + pad(d.getMonth() + 1) + "/" + d.getFullYear() +
              " " + pad(d.getHours()) + ":" + pad(d.getMinutes()),
          );
        }

        function openModal(info, title) {
          pending = info;
          var box = ensureModal().querySelector(".ub-box");
          var rows = SECTIONS.map(function (s) {
            var inFile = info.found[s.id];
            var cur = readCurrent(s);
            var meta =
              'ব্যাকআপে: <b>' + countLabel(s, inFile) + "</b> &nbsp;•&nbsp; বর্তমানে: <b>" +
              countLabel(s, cur) + "</b>";
            if (!inFile)
              return (
                '<div class="ub-row na"><input type="checkbox" disabled />' +
                '<div><div class="ub-title">' + esc(s.label) + "</div>" +
                '<div class="ub-meta">এই ফাইলে নেই — বর্তমান ডেটা অপরিবর্তিত থাকবে</div></div></div>'
              );
            var mode =
              s.id === "students"
                ? '<select data-ub-mode="students"><option value="replace">সম্পূর্ণ প্রতিস্থাপন (বর্তমান মুছে যাবে)</option>' +
                  '<option value="merge">মার্জ (একই শিক্ষার্থী স্কিপ, নতুন যোগ)</option></select>'
                : "";
            return (
              '<label class="ub-row" data-ub-row="' + s.id + '">' +
              '<input type="checkbox" data-ub-sec="' + s.id + '" checked />' +
              '<div><div class="ub-title">' + esc(s.label) + "</div>" +
              '<div class="ub-meta">' + meta + "</div>" + mode + "</div></label>"
            );
          }).join("");

          var m = info.meta || {};
          box.innerHTML =
            '<h3 id="ubTitle">' + esc(title) + "</h3>" +
            '<p class="ub-sub">ব্যাকআপের তারিখ: ' + fmtDate(m.exportDate || m.timestamp) +
            (m.appVersion ? " &nbsp;•&nbsp; সংস্করণ: " + esc(m.appVersion) : "") +
            (info.kind === "legacy" ? " &nbsp;•&nbsp; পুরোনো (আলাদা) ফরম্যাটের ফাইল" : "") + "</p>" +
            rows +
            '<div class="ub-warn">⚠️ টিক দেওয়া অংশের বর্তমান ডেটা প্রতিস্থাপিত হবে। রিস্টোরের আগে বর্তমান সব ডেটার ' +
            "একটি Recovery Backup স্বয়ংক্রিয়ভাবে রাখা হবে।<br>" +
            "অন্য ট্যাবে school / teachers / students পেজ খোলা থাকলে সেগুলো বন্ধ করে নিন।</div>" +
            '<div class="ub-act"><button type="button" class="ub-cancel">বাতিল</button>' +
            '<button type="button" class="ub-ok">রিস্টোর করুন</button></div>';

          var okBtn = box.querySelector(".ub-ok");
          function sync() {
            var any = false;
            box.querySelectorAll("[data-ub-sec]").forEach(function (cb) {
              var row = box.querySelector('[data-ub-row="' + cb.getAttribute("data-ub-sec") + '"]');
              if (row) row.classList.toggle("off", !cb.checked);
              if (cb.checked) any = true;
            });
            okBtn.disabled = !any;
          }
          box.querySelectorAll("[data-ub-sec]").forEach(function (cb) {
            cb.addEventListener("change", sync);
          });
          box.querySelectorAll("select").forEach(function (sel) {
            sel.addEventListener("click", function (e) {
              e.stopPropagation();
            });
          });
          box.querySelector(".ub-cancel").addEventListener("click", cancel);
          okBtn.addEventListener("click", confirmRestore);
          sync();
          modal.classList.add("open");
          okBtn.focus();
        }

        function cancel() {
          pending = null;
          if (modal) modal.classList.remove("open");
          var inp = document.getElementById("restoreFileInput");
          if (inp) inp.value = "";

        /* ---------- apply (all-or-nothing) ---------- */
        function keyOfStudent(s) {
          return [s.academicYear, s.class, s.section, s.roll, s.nameBn]
            .map(function (x) {
              return String(x == null ? "" : x).trim();
            })
            .join("|");
        }

        function confirmRestore() {
          if (!pending) return;
          var box = modal.querySelector(".ub-box");
          var chosen = [];
          box.querySelectorAll("[data-ub-sec]").forEach(function (cb) {
            if (cb.checked) chosen.push(cb.getAttribute("data-ub-sec"));
          });
          if (!chosen.length) return;
          var modeSel = box.querySelector('[data-ub-mode="students"]');
          var studentMode = modeSel ? modeSel.value : "replace";

          /* ১) বর্তমান অবস্থার Recovery Backup */
          var cur = snapshotAll();
          if (cur) {
            if (!lsSet(PRE_KEY, JSON.stringify(buildPayload(cur)))) {
              if (!confirm("Recovery Backup সংরক্ষণ করা যায়নি (স্টোরেজ পূর্ণ হতে পারে)।\n\nতবুও চালিয়ে যাবেন?"))
                return;
            }
          }

          /* ২) নতুন মান তৈরি */
          var writes = []; /* {key, value} */
          var info = [];
          var found = pending.found;
          for (var i = 0; i < chosen.length; i++) {
            var sec = byId(chosen[i]);
            var incoming = found[sec.id];
            var finalVal = incoming;
            if (sec.id === "students" && studentMode === "merge") {
              var existing = readCurrent(sec) || [];
              var seen = {};
              existing.forEach(function (s) {
                seen[keyOfStudent(s)] = 1;
              });
              var added = 0, skipped = 0;
              finalVal = existing.slice();
              incoming.forEach(function (s) {
                var k = keyOfStudent(s);
                if (seen[k]) skipped++;
                else {
                  seen[k] = 1;
                  finalVal.push(s);
                  added++;
                }
              });
              info.push("শিক্ষার্থী মার্জ: যোগ " + toBn(added) + ", স্কিপ " + toBn(skipped));
            }
            var json = JSON.stringify(finalVal);
            sec.keys.forEach(function (k) {
              writes.push({ key: k, value: json });
            });
          }

          /* ৩) লিখি; ব্যর্থ হলে সব আগের অবস্থায় ফেরত */
          var undo = [];
          var ok = true;
          for (var j = 0; j < writes.length; j++) {
            var old = lsGet(writes[j].key);
            if (!lsSet(writes[j].key, writes[j].value)) {
              ok = false;
              break;
            }
            undo.push({ key: writes[j].key, old: old });
          }
          if (!ok) {
            undo.reverse().forEach(function (u) {
              if (u.old === null) lsDel(u.key);
              else lsSet(u.key, u.old);
            });
            toast("রিস্টোর ব্যর্থ — ব্রাউজার স্টোরেজ পূর্ণ। আগের ডেটা অক্ষত আছে।", "err");
            return;
          }

          lsSet(RESTORE_KEY, new Date().toISOString());
          pending = null;
          modal.classList.remove("open");
          toast("ডেটা সফলভাবে রিস্টোর হয়েছে" + (info.length ? " — " + info.join("; ") : "") + "। পেজ রিলোড হচ্ছে…", "ok");
          setTimeout(function () {
            location.reload();
          }, 1100);
        }

        /* ---------- public entry points ---------- */
        function handleFile(event, host) {
          var input = event.target;
          var file = input.files && input.files[0];
          if (!file) return;
          var reader = new FileReader();
          reader.onerror = function () {
            toast("ফাইল পড়া যায়নি", "err");
            input.value = "";
          };
          reader.onload = function (e) {
            var parsed = parse(e.target.result);
            if (parsed == null) {
              toast("ফাইলটি বৈধ JSON নয়", "err");
              input.value = "";
              return;
            }
            var info = detect(parsed, host);
            if (!info) {
              toast("ফাইলে কোনো বৈধ ডেটা পাওয়া যায়নি", "err");
              input.value = "";
              return;
            }
            openModal(info, "ব্যাকআপ থেকে রিস্টোর করুন");
          };
          reader.readAsText(file, "UTF-8");
        }

        function recover(host) {
          var raw = parse(lsGet(PRE_KEY));
          var info = raw ? detect(raw, host) : null;
          if (!info) {
            /* আগের (আলাদা) অ্যাপ-ভিত্তিক Recovery থাকলে সেটাই */
            var hs = byId(host);
            if (hs && hs.legacyPreKey) {
              var old = parse(lsGet(hs.legacyPreKey));
              var v = shape(hs, old) || (old && shape(hs, old[hs.legacyProp]));
              if (v) {
                var f = {};
                f[hs.id] = v;
                info = { found: f, meta: isObj(old) ? old : {}, kind: "legacy" };
              }
            }
          }
          if (!info) {
            toast("কোনো Recovery Backup পাওয়া যায়নি", "err");
            return;
          }
          openModal(info, "Recovery Backup থেকে ফিরিয়ে আনুন");
        }

        function stamp(iso) {
          var d = iso ? new Date(iso) : null;
          if (!d || isNaN(d)) return "";
          return toBn(
            pad(d.getDate()) + "/" + pad(d.getMonth() + 1) + "/" + d.getFullYear() +
              " " + pad(d.getHours()) + ":" + pad(d.getMinutes()),
          );
        }
        /* সব পেজের ব্যাকআপ-বারে একই ফরম্যাটের তথ্য-লাইন */
        function metaText(host, count, unit) {
          var hs = byId(host);
          var b = lsGet(LAST_KEY) || (hs && hs.lastKeys[0] ? lsGet(hs.lastKeys[0]) : null);
          var t =
            "সর্বশেষ ব্যাকআপ: " + (stamp(b) || "এখনো নেওয়া হয়নি") +
            " • সর্বশেষ রিস্টোর: " + (stamp(lsGet(RESTORE_KEY)) || "এখনো করা হয়নি");
          if (count != null) t += " • মোট: " + toBn(count) + (unit ? " " + unit : "");
          return t;
        }

        window.UnifiedBackup = {
          VERSION: APP_VERSION,
          metaText: metaText,
          backup: backup,
          handleFile: handleFile,
          recover: recover,
          lastInfo: function () {
            return { backup: lsGet(LAST_KEY), restore: lsGet(RESTORE_KEY) };
          },
          FORMAT: FORMAT,
        };
      })();
    </script>

            "ডিজিটাল কনফারেন্স সিস্টেম",
            "ইন্টারকম",
            "রাউটার",
            "আইপি ফোন",
            "ইন্টারেক্টিভ ফ্ল্যাট প্যানেল (আইএফপি)",
            "মোবাইল",
          ],
        },
        { id: "serialNo", label: "সিরিয়াল নং", type: "text" },
        { id: "brand", label: "ব্র্যান্ড", type: "text" },
        { id: "model", label: "মডেল", type: "text" },
        { id: "yearOfReceiptOfGoods", label: "পণ্য গ্রহনের সন", type: "text" },
        {
          id: "sourceOfProductAcquisition",
          label: "পণ্য প্রাপ্তির উৎস",
          type: "select",
          options: [
            "পিইডিপি৪",
            "পিইডিপি-৩",
            "নিজস্ব",
            "সরকারী",
            "বেসরকারি",
            "অন্যান্য",
          ],
        },
        {
          id: "condition",
          label: "পণ্যের বর্তমান অবস্থা",
          type: "select",
          options: ["নতুন", "পুরোনো", "ব্যবহারযোগ্য", "অ-ব্যবহারযোগ্য/নষ্ট"],
        },
        { id: "commentsOnIctEquipment", label: "মন্তব্য", type: "text" },
      ];

      const DYN_MAP = {
        buildings: { key: "buildings", fields: BUILDING_FIELDS, title: "ভবন" },
        rooms: { key: "rooms", fields: ROOM_FIELDS, title: "কক্ষ" },
        washblock: {
          key: "washblocks",
          fields: WASHBLOCK_FIELDS,
          title: "ওয়াশব্লক",
        },
        water: {
          key: "waters",
          fields: WATER_FIELDS,
          title: "পানীয় জলের উৎস",
        },
        sanitation: {
          key: "sanitations",
          fields: SANITATION_FIELDS,
          title: "টয়লেট",
        },
        furniture: {
          key: "furnitures",
          fields: FURNITURE_FIELDS,
          title: "আসবাবপত্র",
        },
        ictEquipment: {
          key: "ictEquipments",
          fields: ICT_EQUIPMENT_FIELDS,
          title: "সরঞ্জাম",
        },
      };

      const SKIP_BN_DIGITS_IDS = new Set([
        "schoolName",
        "serialNo",
        "brand",
        "model",
      ]);
      const COPYABLE_IDS = new Set([
        "schoolCode",
        "bankAccountNo",
        "ledgerBsNumber",
        "dagNumber",
        "recordDocumentNo",
        "csPlotNo",
        "csKhatianNo",
        "rsPlotNo",
        "rsLedgerNo",
        "saPlotNo",
        "saLedgerNo",
      ]);
      const COPYABLE_DYN_IDS = new Set(["serialNo", "brand", "model"]);

      const $ = (id) => document.getElementById(id);
      const BN_DIGITS = ["০", "১", "২", "৩", "৪", "৫", "৬", "৭", "৮", "৯"];
      function toBn(s) {
        if (s === null || s === undefined || s === "") return "";
        return String(s).replace(/\d/g, (d) => BN_DIGITS[+d]);
      }
      function displayBn(fieldId, value) {
        const v = clean(value);
        if (!v) return "";
        if (SKIP_BN_DIGITS_IDS.has(fieldId)) return v;
        return toBn(v);
      }
      function clean(v) {
        return String(v === null || v === undefined ? "" : v).trim();
      }
      function escapeHtml(s) {
        return String(s === null || s === undefined ? "" : s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }
      function escapeJs(text) {
        return String(text === null || text === undefined ? "" : text)
          .replace(/\\/g, "\\\\")
          .replace(/'/g, "\\'")
          .replace(/\r?\n/g, "\\n");
      }
      function safeParse(raw) {
        try {
          return JSON.parse(raw);
        } catch (e) {
          return null;
        }
      }
      let toastTimer = null;
      function showToast(msg, type) {
        const t = $("toast");
        if (!t) return;
        t.textContent = msg;
        t.className = "toast show " + (type || "");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          t.className = "toast";
        }, 2200);
      }
      function dateStamp() {
        const n = new Date();
        return (
          String(n.getDate()).padStart(2, "0") +
          "-" +
          String(n.getMonth() + 1).padStart(2, "0") +
          "-" +
          n.getFullYear()
        );
      }

      const Store = (function () {
        let available = true;
        const mem = Object.create(null);
        try {
          const tk = "__school_probe__";
          localStorage.setItem(tk, "1");
          localStorage.removeItem(tk);
        } catch (e) {
          available = false;
        }
        return {
          get available() {
            return available;
          },
          get(k) {
            if (k in mem) return mem[k];
            if (!available) return null;
            try {
              return localStorage.getItem(k);
            } catch (e) {
              return null;
            }
          },
          set(k, v) {
            mem[k] = v;
            if (!available) return false;
            try {
              localStorage.setItem(k, v);
              return true;
            } catch (e) {
              return false;
            }
          },
        };
      })();

      let schoolData = {
        classes: [],
        buildings: [],
        rooms: [],
        washblocks: [],
        waters: [],
        sanitations: [],
        furnitures: [],
        ictEquipments: [],
      };
      let editState = { sectionId: null, mode: null, dynKey: null, dynArr: [] };

      const COPY_SVG =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
      const CHECK_SVG =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';

      function copyToClipboard(text, btn) {
        if (!text || !text.trim()) return;
        const done = () => {
          btn.classList.add("copied");
          btn.innerHTML = CHECK_SVG;
          setTimeout(() => {
            btn.classList.remove("copied");
            btn.innerHTML = COPY_SVG;
          }, 1300);
          showToast("কপি করা হয়েছে (মূল ফরম্যাট)", "ok");
        };
        const fallback = () => {
          try {
            const ta = document.createElement("textarea");
            ta.value = text;
            ta.style.position = "fixed";
            ta.style.left = "-999999px";
            document.body.appendChild(ta);
            ta.focus();
            ta.select();
            document.execCommand("copy");
            ta.remove();
            done();
          } catch (e) {
            showToast("কপি করা যায়নি", "err");
          }
        };
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(text).then(done).catch(fallback);
        } else fallback();
      }
      window.copyToClipboard = copyToClipboard;

      /* ============================================================
         Dashboard rendering (deferred)
      ============================================================ */
      function buildToc() {
        $("tocNav").innerHTML = SECTIONS.map(
          (s, i) =>
            '<button type="button" class="toc-pill' +
            (i === 0 ? " active" : "") +
            '" data-toc="' +
            s.id +
            '" onclick="scrollToSection(\'' +
            s.id +
            "')\">" +
            escapeHtml(s.title) +
            "</button>",
        ).join("");
      }
      function scrollToSection(id) {
        const el = document.getElementById("sec-" + id);
        if (!el) return;
        const y = el.getBoundingClientRect().top + window.pageYOffset - 80;
        window.scrollTo({ top: y, behavior: "smooth" });
      }
      window.scrollToSection = scrollToSection;

      function updateTocActive() {
        const pills = document.querySelectorAll(".toc-pill");
        let bestId = null,
          bestTop = -Infinity;
        SECTIONS.forEach((s) => {
          const el = document.getElementById("sec-" + s.id);
          if (!el) return;
          const top = el.getBoundingClientRect().top;
          if (top - 110 <= 0 && top > bestTop) {
            bestTop = top;
            bestId = s.id;
          }
        });
        if (bestId) {
          pills.forEach((p) => {
            const on = p.dataset.toc === bestId;
            p.classList.toggle("active", on);
            if (on && p.scrollIntoView) {
              const nav = $("tocNav");
              if (nav) {
                const pr = p.getBoundingClientRect();
                const nr = nav.getBoundingClientRect();
                if (pr.left < nr.left || pr.right > nr.right) {
                  p.scrollIntoView({
                    behavior: "smooth",
                    inline: "center",
                    block: "nearest",
                  });
                }
              }
            }
          });
        }
      }

      function renderDashboard() {
        $("dashboard").innerHTML = SECTIONS.map((sec) =>
          renderSection(sec),
        ).join("");
      }

      /* Re-render only one section in place (fast path) */
      function rerenderSection(id) {
        const sec = findSection(id);
        const old = document.getElementById("sec-" + id);
        if (!sec || !old) {
          renderDashboard();
          return;
        }
        const tmp = document.createElement("div");
        tmp.innerHTML = renderSection(sec).trim();
        const newNode = tmp.firstElementChild;
        if (newNode) old.replaceWith(newNode);
      }

      function renderSection(sec) {
        const isDyn = !!DYN_MAP[sec.id];
        let count = 0;
        if (isDyn) count = (schoolData[DYN_MAP[sec.id].key] || []).length;
        if (sec.special === "classes")
          count = (schoolData.classes || []).length;

        const countHtml =
          (isDyn || sec.special === "classes") && count > 0
            ? '<span class="count-badge">' + toBn(count) + " টি</span>"
            : "";

        let body = "";
        if (sec.special === "classes") body = renderClassesBody();
        else if (isDyn) body = renderDynBody(DYN_MAP[sec.id]);
        else if (sec.fields) body = renderFieldsBody(sec.fields);

        return (
          '<div class="section-card" id="sec-' +
          sec.id +
          '">' +
          '<div class="section-card-header">' +
          '<div class="section-card-title">' +
          '<span class="sec-icon">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
          sec.icon +
          "</svg>" +
          "</span>" +
          '<span class="sec-text">' +
          escapeHtml(sec.title) +
          "</span>" +
          "</div>" +
          '<div class="section-card-header-right">' +
          countHtml +
          '<button class="edit-btn" onclick="openEdit(\'' +
          sec.id +
          '\')" title="সম্পাদনা করুন">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>' +
          "</button>" +
          "</div>" +
          "</div>" +
          '<div class="section-card-body">' +
          body +
          "</div>" +
          "</div>"
        );
      }

      function renderFieldsBody(fields) {
        return (
          '<div class="info-grid">' +
          fields.map((f) => renderInfoItem(f, schoolData[f.id])).join("") +
          "</div>"
        );
      }

      function renderInfoItem(field, rawVal) {
        const raw = clean(rawVal);
        const isEmpty = !raw;
        const shown = displayBn(field.id, raw);
        const isCopy = COPYABLE_IDS.has(field.id) && !isEmpty;
        const fullCls = field.full ? " full" : "";
        const valueHtml = isEmpty
          ? '<div class="info-value empty"></div>'
          : '<div class="info-value">' + escapeHtml(shown) + "</div>";
        const copyHtml = isCopy
          ? '<button class="copy-btn" onclick="copyToClipboard(\'' +
            escapeJs(raw) +
            '\',this)" title="কপি করুন">' +
            COPY_SVG +
            "</button>"
          : "";
        return (
          '<div class="info-item' +
          fullCls +
          '">' +
          '<div class="info-label">' +
          escapeHtml(field.label) +
          "</div>" +
          '<div class="info-value-row">' +
          valueHtml +
          copyHtml +
          "</div>" +
          "</div>"
        );
      }

      function renderDynBody(dyn) {
        const arr = schoolData[dyn.key] || [];
        if (arr.length === 0) {
          return (
            '<div class="empty-state">' +
            '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>' +
            "<div>কোনো তথ্য যোগ করা হয়নি</div></div>"
          );
        }
        return (
          '<div class="sub-list">' +
          arr
            .map((item, i) => {
              const fieldsHtml = dyn.fields
                .map((f) => {
                  const raw = clean(item[f.id]);
                  const isEmpty = !raw;
                  const shown = displayBn(f.id, raw);
                  const isCopy = COPYABLE_DYN_IDS.has(f.id) && !isEmpty;
                  return (
                    '<div class="info-item">' +
                    '<div class="info-label">' +
                    escapeHtml(f.label) +
                    "</div>" +
                    '<div class="info-value-row">' +
                    (isEmpty
                      ? '<div class="info-value empty"></div>'
                      : '<div class="info-value">' +
                        escapeHtml(shown) +
                        "</div>") +
                    (isCopy
                      ? '<button class="copy-btn" onclick="copyToClipboard(\'' +
                        escapeJs(raw) +
                        '\',this)" title="কপি করুন">' +
                        COPY_SVG +
                        "</button>"
                      : "") +
                    "</div></div>"
                  );
                })
                .join("");
              return (
                '<div class="sub-card">' +
                '<div class="sub-card-head">' +
                '<span class="num-badge">' +
                toBn(i + 1) +
                "</span>" +
                '<span class="sub-title">' +
                escapeHtml(dyn.title) +
                " #" +
                toBn(i + 1) +
                "</span>" +
                "</div>" +
                '<div class="info-grid">' +
                fieldsHtml +
                "</div>" +
                "</div>"
              );
            })
            .join("") +
          "</div>"
        );
      }

      function renderClassesBody() {
        const list = schoolData.classes || [];
        if (list.length === 0)
          return '<div class="empty-state">কোনো শ্রেণি নির্বাচন করা হয়নি</div>';
        return (
          '<div class="class-chips">' +
          list
            .map(
              (c) =>
                '<span class="class-chip">' +
                '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>' +
                escapeHtml(c) +
                "</span>",
            )
            .join("") +
          "</div>"
        );
      }

      function findSection(id) {
        return SECTIONS.find((s) => s.id === id);
      }

      /* ============================================================
         Edit modal
      ============================================================ */
      function openEdit(sectionId) {
        const sec = findSection(sectionId);
        if (!sec) return;
        editState.sectionId = sectionId;
        $("editTitle").innerHTML =
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
          sec.icon +
          "</svg>" +
          escapeHtml(sec.title);

        const bodyEl = $("editBody");

        if (sec.special === "classes") {
          editState.mode = "classes";
          bodyEl.innerHTML = renderClassesEditor();
        } else if (DYN_MAP[sectionId]) {
          editState.mode = "dyn";
          editState.dynKey = DYN_MAP[sectionId].key;
          editState.dynArr = JSON.parse(
            JSON.stringify(schoolData[editState.dynKey] || []),
          );
          bodyEl.innerHTML =
            '<div class="dyn-list" id="modalDynList"></div>' +
            '<button type="button" class="btn-add-item" onclick="addDynItem()">' +
            '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>' +
            "নতুন আইটেম যোগ করুন</button>";
          renderModalDynList();
        } else if (sec.fields) {
          editState.mode = "fields";
          bodyEl.innerHTML = renderFieldsEditor(sec.fields);
        }
        $("editModal").classList.add("open");
      }

      function closeEdit() {
        $("editModal").classList.remove("open");
        editState = { sectionId: null, mode: null, dynKey: null, dynArr: [] };
      }

      function saveEdit() {
        const sec = findSection(editState.sectionId);
        if (!sec) {
          closeEdit();
          return;
        }
        if (editState.mode === "fields") {
          sec.fields.forEach((f) => {
            const el = document.getElementById("edit-" + f.id);
            if (el) schoolData[f.id] = clean(el.value);
          });
        } else if (editState.mode === "classes") {
          const arr = [];
          document.querySelectorAll("[data-edit-class]").forEach((cb) => {
            if (cb.checked) arr.push(cb.getAttribute("data-edit-class"));
          });
          schoolData.classes = arr;
        } else if (editState.mode === "dyn") {
          schoolData[editState.dynKey] = editState.dynArr;
        }
        if (!Store.set(STORAGE_KEY, JSON.stringify(schoolData))) {
          showToast("ডেটা সংরক্ষণ করা যায়নি", "err");
          return;
        }
        /* PERF: only re-render the section that changed */
        const editedId = editState.sectionId;
        closeEdit();
        rerenderSection(editedId);
        showToast("তথ্য সংরক্ষণ করা হয়েছে", "ok");
      }
      window.openEdit = openEdit;
      window.closeEdit = closeEdit;
      window.saveEdit = saveEdit;

      function renderFieldsEditor(fields) {
        let html = '<div class="edit-grid">';
        fields.forEach((f) => {
          const v = clean(schoolData[f.id]);
          const cls = f.full ? " full" : "";
          html +=
            '<div class="form-group' +
            cls +
            '"><label>' +
            escapeHtml(f.label) +
            (f.required ? ' <span style="color:#ef4444">*</span>' : "") +
            "</label>";
          if (f.type === "select") {
            html +=
              '<select id="edit-' +
              f.id +
              '"><option value="">-- নির্বাচন করুন --</option>' +
              f.options
                .map(
                  (o) =>
                    '<option value="' +
                    escapeHtml(o) +
                    '"' +
                    (String(v) === String(o) ? " selected" : "") +
                    ">" +
                    escapeHtml(o) +
                    "</option>",
                )
                .join("") +
              "</select>";
          } else {
            html +=
              '<input type="text" id="edit-' +
              f.id +
              '" value="' +
              escapeHtml(v) +
              '" />';
          }
          html += "</div>";
        });
        html += "</div>";
        return html;
      }

      function renderClassesEditor() {
        const sel = schoolData.classes || [];
        return (
          '<div class="class-check-grid">' +
          CLASS_LIST.map(
            (c) =>
              '<label class="check-chip"><input type="checkbox" data-edit-class="' +
              escapeHtml(c) +
              '"' +
              (sel.indexOf(c) !== -1 ? " checked" : "") +
              " /> " +
              escapeHtml(c) +
              "</label>",
          ).join("") +
          "</div>"
        );
      }

      function renderModalDynList() {
        const c = $("modalDynList");
        if (!c) return;
        const dyn = DYN_MAP[editState.sectionId];
        if (!dyn) return;
        const arr = editState.dynArr;
        if (arr.length === 0) {
          c.innerHTML =
            '<div class="empty-state">কোনো আইটেম নেই। "নতুন আইটেম যোগ করুন" ক্লিক করুন।</div>';
          return;
        }
        c.innerHTML = arr
          .map((item, i) => {
            let fieldsHtml = "";
            dyn.fields.forEach((f) => {
              const v = clean(item[f.id]);
              fieldsHtml +=
                '<div class="form-group"><label>' +
                escapeHtml(f.label) +
                "</label>";
              if (f.type === "select") {
                fieldsHtml +=
                  '<select onchange="updateModalDynItem(' +
                  i +
                  ",'" +
                  f.id +
                  "',this.value)\">" +
                  '<option value="">-- নির্বাচন করুন --</option>' +
                  f.options
                    .map(
                      (o) =>
                        '<option value="' +
                        escapeHtml(o) +
                        '"' +
                        (String(v) === String(o) ? " selected" : "") +
                        ">" +
                        escapeHtml(o) +
                        "</option>",
                    )
                    .join("") +
                  "</select>";
              } else {
                fieldsHtml +=
                  '<input type="text" value="' +
                  escapeHtml(v) +
                  '" oninput="updateModalDynItem(' +
                  i +
                  ",'" +
                  f.id +
                  "',this.value)\" />";
              }
              fieldsHtml += "</div>";
            });
            return (
              '<div class="dyn-item">' +
              '<div class="dyn-item-head">' +
              '<div class="dyn-item-title"><span class="num-badge">' +
              toBn(i + 1) +
              "</span>" +
              escapeHtml(dyn.title) +
              " #" +
              toBn(i + 1) +
              "</div>" +
              '<button type="button" class="btn-remove" onclick="removeModalDynItem(' +
              i +
              ')">✕ সরান</button>' +
              "</div>" +
              '<div class="edit-grid">' +
              fieldsHtml +
              "</div>" +
              "</div>"
            );
          })
          .join("");
      }

      function updateModalDynItem(i, field, value) {
        if (editState.dynArr[i]) editState.dynArr[i][field] = value;
      }
      function addDynItem() {
        editState.dynArr.push({});
        renderModalDynList();
      }
      function removeModalDynItem(i) {
        editState.dynArr.splice(i, 1);
        renderModalDynList();
      }
      window.updateModalDynItem = updateModalDynItem;
      window.addDynItem = addDynItem;
      window.removeModalDynItem = removeModalDynItem;

      /* ============================================================
         Export (lazy-loads SheetJS on click)
      ============================================================ */
      async function exportExcel() {
        const btn = $("btnExcel");
        if (btn) btn.disabled = true;
        try {
          await loadXLSX();
        } catch (e) {
          showToast(
            "Excel লাইব্রেরি লোড হয়নি — ইন্টারনেট পরীক্ষা করুন",
            "err",
          );
          if (btn) btn.disabled = false;
          return;
        }
        if (typeof XLSX === "undefined") {
          showToast("Excel লাইব্রেরি লোড হয়নি", "err");
          if (btn) btn.disabled = false;
          return;
        }
        try {
          const wb = XLSX.utils.book_new();
          const kvAoa = [["বিভাগ", "ক্ষেত্র", "মান"]];
          SECTIONS.forEach((sec) => {
            if (sec.fields)
              sec.fields.forEach((f) =>
                kvAoa.push([sec.title, f.label, schoolData[f.id] || ""]),
              );
            else if (sec.special === "classes")
              kvAoa.push([
                sec.title,
                "শ্রেণি",
                (schoolData.classes || []).join(", "),
              ]);
          });
          const ws1 = XLSX.utils.aoa_to_sheet(kvAoa);
          ws1["!cols"] = [{ wch: 34 }, { wch: 40 }, { wch: 46 }];
          XLSX.utils.book_append_sheet(wb, ws1, "সারসংক্ষেপ");

          const addDyn = (key, fields, name) => {
            const arr = schoolData[key] || [];
            if (!arr.length) return;
            const aoa = [fields.map((f) => f.label)];
            arr.forEach((it) => aoa.push(fields.map((f) => it[f.id] || "")));
            XLSX.utils.book_append_sheet(
              wb,
              XLSX.utils.aoa_to_sheet(aoa),
              name,
            );
          };
          addDyn("buildings", BUILDING_FIELDS, "ভবন");
          addDyn("rooms", ROOM_FIELDS, "কক্ষ");
          addDyn("washblocks", WASHBLOCK_FIELDS, "ওয়াশব্লক");
          addDyn("waters", WATER_FIELDS, "পানীয় জল");
          addDyn("sanitations", SANITATION_FIELDS, "স্যানিটেশন");
          addDyn("furnitures", FURNITURE_FIELDS, "আসবাবপত্র");
          addDyn("ictEquipments", ICT_EQUIPMENT_FIELDS, "আইসিটি সরঞ্জাম");

          XLSX.writeFile(wb, "school_data_" + dateStamp() + ".xlsx");
          showToast("Excel ফাইল ডাউনলোড হয়েছে", "ok");
        } catch (e) {
          console.error(e);
          showToast("Excel তৈরি করা যায়নি", "err");
        } finally {
          if (btn) btn.disabled = false;
        }
      }
      window.exportExcel = exportExcel;

      function updateBackupMeta() {
        const el = $("backupMeta");
        if (el) el.textContent = UnifiedBackup.metaText("school");
      }
      function downloadJSONBackup() {
        if (UnifiedBackup.backup()) updateBackupMeta();
      }
      window.downloadJSONBackup = downloadJSONBackup;

      function handleRestoreFile(event) {
        UnifiedBackup.handleFile(event, "school");
      }
      window.handleRestoreFile = handleRestoreFile;
      function recoverPrevious() {
        UnifiedBackup.recover("school");
      }
      window.recoverPrevious = recoverPrevious;

      function printDashboard() {
        try {
          window.print();
        } catch (e) {
          showToast("প্রিন্ট শুরু করা যায়নি", "err");
        }
      }
      window.printDashboard = printDashboard;

      /* ============================================================
         Init
      ============================================================ */
      function bindScrollSpy() {
        let ticking = false;
        window.addEventListener(
          "scroll",
          () => {
            if (!ticking) {
              ticking = true;
              requestAnimationFrame(() => {
                updateTocActive();
                ticking = false;
              });
            }
          },
          { passive: true },
        );
      }
      function bindModals() {
        document
          .getElementById("editModal")
          .addEventListener("click", function (e) {
            if (e.target === this) closeEdit();
          });
        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape" && $("editModal").classList.contains("open"))
            closeEdit();
        });
      }

      function init() {
        try {
          /* Load saved data first (cheap) */
          const raw = Store.get(STORAGE_KEY);
          if (raw) {
            const parsed = safeParse(raw);
            if (parsed && typeof parsed === "object")
              schoolData = Object.assign(schoolData, parsed);
          }

          /* Paint header + TOC immediately */
          buildToc();
          bindModals();
          bindScrollSpy();

          /* PERF: defer dashboard card construction so first paint happens now */
          requestAnimationFrame(() => {
            renderDashboard();
            updateTocActive();
          });

          if (!Store.available)
            showToast("এই ব্রাউজারে স্থায়ী স্টোরেজ নেই", "err");
        } catch (err) {
          console.error(err);
          showToast("অ্যাপ চালু করতে সমস্যা হয়েছে", "err");
        }
      }

      window.addEventListener("error", (e) => {
        if (e && e.message) console.error("Runtime:", e.message);
      });
      init();
      updateBackupMeta();
    </script>
